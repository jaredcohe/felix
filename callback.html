<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Connecting…</title><style>body{font:16px/1.6 -apple-system,system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px}</style></head>
<body><p id="m">Finishing the QuickBooks connection…</p>
<script>
// Forwards Intuit's OAuth response to the app running on this computer.
// Nothing is stored or sent anywhere else. Port can be overridden with #port=NNNN.
var port = (location.hash.match(/port=(\d+)/) || [])[1] || '3000';
if (location.search) location.replace('http://localhost:' + port + '/callback' + location.search);
else document.getElementById('m').textContent = 'Nothing to do here.';
</script></body></html>
